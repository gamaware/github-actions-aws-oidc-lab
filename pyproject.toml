[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["app/tests", "tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["S101"]
"tests/*" = ["S101"]
