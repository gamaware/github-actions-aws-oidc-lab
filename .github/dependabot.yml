version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pip-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      terraform-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]
