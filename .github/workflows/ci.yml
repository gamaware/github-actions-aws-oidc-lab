name: ci

# Thin caller: the shared checks come from reusable workflows in
# gamaware/.github, and `verify` runs the same `make verify` a reviewer runs
# locally. Pull requests get no AWS access at all: no id-token permission, no
# secrets, no role to assume. The image gates with SARIF live in security.yml
# (docs/adr/0006-security-gates.md).
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: make verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HADOLINT_VERSION: "2.15.1"
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
      SHELLHARDEN_VERSION: "4.3.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      # infra/terraform/.terraform-version is the single place the version is pinned.
      - name: Read the pinned Terraform version
        id: tf
        run: echo "version=$(cat infra/terraform/.terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.61.0

      - name: Install hadolint and shellharden
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  $RUNNER_TEMP/bin/hadolint" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/hadolint"
          cargo install shellharden --locked --version "$SHELLHARDEN_VERSION" --root "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: make verify
        env:
          # Avoids the anonymous GitHub API rate limit when tflint fetches the AWS ruleset.
          GITHUB_TOKEN: ${{ github.token }}
        run: make verify

  docs:
    name: docs
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/lint-docs.yml@1255caafb08b06cc4658318c4dd48f9dea946c9e

  actions:
    name: actions
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/lint-actions.yml@1255caafb08b06cc4658318c4dd48f9dea946c9e

  secrets:
    name: secrets
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/secrets.yml@1255caafb08b06cc4658318c4dd48f9dea946c9e

  container:
    name: container
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/container.yml@1255caafb08b06cc4658318c4dd48f9dea946c9e
    with:
      context: app
      dockerfile: app/Dockerfile
      image-name: oidc-lab

  # Semgrep and Checkov run as SARIF gates in security.yml; the shared job adds
  # a Trivy scan of the whole repository (vulnerabilities, secrets, IaC).
  repo-scan:
    name: repo-scan
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/security.yml@1255caafb08b06cc4658318c4dd48f9dea946c9e
    with:
      run-semgrep: false
      run-checkov: false
