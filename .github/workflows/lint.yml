name: lint

# Static checks and offline tests for workflows and Terraform. None of them
# touch AWS: terraform test runs against a mocked provider.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: actionlint and zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: actionlint
        run: uvx --from actionlint-py==1.7.12.25 actionlint

      - name: zizmor
        run: uvx zizmor==1.30.1 --offline .github/workflows

  terraform:
    name: Terraform fmt, validate, test and tflint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # infra/.terraform-version is the single place the version is pinned.
      - name: Read the pinned Terraform version
        id: tf
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      - name: terraform test (mocked provider)
        run: terraform test

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.61.0

      - name: tflint
        env:
          # Avoids the anonymous GitHub API rate limit when fetching the AWS ruleset.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config .tflint.hcl
          tflint --config .tflint.hcl --format compact
