name: plan

# Example workflow, not active in this repository. A client who wants a
# read-only terraform plan on pull requests copies it to .github/workflows/ in
# their own repository, sets create_plan_role = true in Terraform and adds the
# repository variable AWS_PLAN_ROLE_ARN. Installing it gives same-repository
# pull requests an OIDC token that the read-only plan role accepts; this
# repository's own pull request workflows request no id-token at all.
# The plan role trusts only the pull_request subject and can read, not change,
# the stack and its state object. Fork pull requests get no id-token, so the
# job is skipped for them. See docs/adr/0007-read-only-plan-role.md.
on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/plan.yml" # its path once installed

permissions: {}

concurrency:
  group: plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Terraform plan (read-only)
    if: ${{ vars.AWS_PLAN_ROLE_ARN != '' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'github-actions-aws-oidc-lab/terraform.tfstate' }}
      # The same non-secret values used for `terraform apply`, as one JSON object.
      TF_VARS_JSON: ${{ vars.TF_VARS_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Terraform version
        id: tf
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false

      - name: Assume the read-only plan role with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-plan-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init with the S3 backend
        run: |
          cp backend.tf.example backend.tf
          printf '%s' "$TF_VARS_JSON" > ci.auto.tfvars.json
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"

      # -lock=false: the role cannot write the lock file, and a plan changes
      # nothing. Applies still run from a workstation with the lock.
      - name: terraform plan
        run: |
          terraform plan -input=false -lock=false -no-color -out=tfplan
          {
            echo "### terraform plan"
            echo
            echo '```text'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
